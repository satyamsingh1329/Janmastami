<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <radialGradient id="eyeCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="40%" stop-color="#001233"/>
      <stop offset="70%" stop-color="#023e8a"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </radialGradient>
    <radialGradient id="eyeTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="60%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#118ab2"/>
    </radialGradient>
    <radialGradient id="eyeGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </radialGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d8a6"/>
      <stop offset="50%" stop-color="#ee9b00"/>
      <stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <linearGradient id="featherFib" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#118ab2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#073b4c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#divineGlow)">
    <!-- Whisps / Barbs (Side fibers) -->
    <!-- Left side -->
    <path d="M 50,40 Q 20,25 5,50" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,48 Q 15,35 2,65" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,56 Q 10,48 5,80" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,65 Q 12,62 8,95" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,75 Q 15,78 12,110" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,88 Q 20,95 18,125" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,102 Q 25,115 22,140" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 50,118 Q 30,135 28,155" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.75"/>
    <path d="M 50,135 Q 35,155 35,170" stroke="url(#featherFib)" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Right side -->
    <path d="M 50,40 Q 80,25 95,50" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,48 Q 85,35 98,65" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,56 Q 90,48 95,80" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,65 Q 88,62 92,95" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,75 Q 85,78 88,110" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,88 Q 80,95 82,125" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.85"/>
    <path d="M 50,102 Q 75,115 78,140" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.8"/>
    <path d="M 50,118 Q 70,135 72,155" stroke="url(#featherFib)" stroke-width="1.2" fill="none" opacity="0.75"/>
    <path d="M 50,135 Q 65,155 65,170" stroke="url(#featherFib)" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Central Quill Stem -->
    <path d="M 50,15 Q 49,90 50,195" stroke="url(#quillGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Outer Golden Bronze Ocellus Halo -->
    <ellipse cx="50" cy="45" rx="28" ry="32" fill="url(#eyeGold)" opacity="0.95"/>
    
    <!-- Outer Jade Green / Teal Layer -->
    <path d="M 50,18 C 30,18 26,45 32,60 C 38,72 50,75 50,75 C 50,75 62,72 68,60 C 74,45 70,18 50,18 Z" fill="url(#eyeTeal)" />

    <!-- Royal Azure Blue Ring -->
    <ellipse cx="50" cy="46" rx="16" ry="19" fill="#03045e"/>
    <ellipse cx="50" cy="46" rx="14" ry="16" fill="#0077b6"/>

    <!-- Deep Iridescent Midnight Core (The Eye) -->
    <ellipse cx="50" cy="44" rx="10" ry="12" fill="url(#eyeCenter)"/>
    <path d="M 43,45 C 43,38 57,38 57,45 C 57,51 43,51 43,45 Z" fill="#9d4edd" opacity="0.8"/>
    <ellipse cx="50" cy="43" rx="5" ry="6" fill="#000814"/>

    <!-- Divine Sparkle in Eye -->
    <circle cx="48" cy="40" r="2" fill="#ffffff" opacity="0.95"/>
    <circle cx="53" cy="44" r="1" fill="#72efdd" opacity="0.8"/>
  </g>
</svg>
